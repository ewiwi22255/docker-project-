# 在 GitHub 上下載映像、啟動整套系統，確認網頁與 API 都正常回應。
# 每次 push、PR，以及每週一自動跑一次（確認 latest 映像仍可用）。
name: smoke-test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下載映像並啟動
        run: bash start.sh

      - name: 檢查網頁與 API
        run: |
          curl -fsS http://localhost/ -o /dev/null
          curl -fsS http://localhost/api/health

      - name: 失敗時印出紀錄
        if: failure()
        run: docker compose logs --no-color

      - name: 關閉
        if: always()
        run: docker compose down -v
